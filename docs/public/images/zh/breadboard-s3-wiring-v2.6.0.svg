<circle cx="390" cy="485" r="4" fill="#128b84"/><circle cx="620" cy="485" r="4" fill="#128b84"/>
<text x="650" y="490" class="port">DIN</text>
<text x="42" y="521" class="port">GPIO15</text>
<path d="M 390 516 H 620" fill="none" stroke="#7656b5" stroke-width="3"/>
<circle cx="390" cy="516" r="4" fill="#7656b5"/><circle cx="620" cy="516" r="4" fill="#7656b5"/>
<text x="650" y="521" class="port">BCLK</text>
<text x="42" y="552" class="port">GPIO16</text>
<path d="M 390 547 H 620" fill="none" stroke="#7656b5" stroke-width="3"/>
<circle cx="390" cy="547" r="4" fill="#7656b5"/><circle cx="620" cy="547" r="4" fill="#7656b5"/>
<text x="650" y="552" class="port">LRC</text>
<text x="42" y="583" class="port">板上 5V（仅已核对的 USB 电源）</text>
<path d="M 390 578 H 620" fill="none" stroke="#c93e32" stroke-width="3"/>
<circle cx="390" cy="578" r="4" fill="#c93e32"/><circle cx="620" cy="578" r="4" fill="#c93e32"/>
