<text x="42" y="762" class="port">SPK− / OUTN</text>
<path d="M 390 757 H 620" fill="none" stroke="#128b84" stroke-width="3"/>
<circle cx="390" cy="757" r="4" fill="#128b84"/><circle cx="620" cy="757" r="4" fill="#128b84"/>
<text x="650" y="762" class="port">扬声器 −</text>
<rect x="18" y="791" width="924" height="194" rx="12" fill="#fff" stroke="#cbded9"/>
<text x="36" y="821" class="group">OLED · SSD1306 I2C</text>
<text x="42" y="847" class="small">ESP32 主控</text>
<text x="650" y="847" class="small">OLED</text>
<text x="42" y="879" class="port">GPIO41</text>
<path d="M 390 874 H 620" fill="none" stroke="#128b84" stroke-width="3"/>
<circle cx="390" cy="874" r="4" fill="#128b84"/><circle cx="620" cy="874" r="4" fill="#128b84"/>
<text x="650" y="879" class="port">SDA</text>
<text x="42" y="910" class="port">GPIO42</text>
<path d="M 390 905 H 620" fill="none" stroke="#7656b5" stroke-width="3"/>
<circle cx="390" cy="905" r="4" fill="#7656b5"/><circle cx="620" cy="905" r="4" fill="#7656b5"/>
<text x="650" y="910" class="port">SCL / SCK</text>
<text x="42" y="941" class="port">3V3</text>
<path d="M 390 936 H 620" fill="none" stroke="#c93e32" stroke-width="3"/>
<circle cx="390" cy="936" r="4" fill="#c93e32"/><circle cx="620" cy="936" r="4" fill="#c93e32"/>
<text x="650" y="941" class="port">VCC</text>
<text x="42" y="972" class="port">GND</text>
<path d="M 390 967 H 620" fill="none" stroke="#53626a" stroke-width="3"/>
<circle cx="390" cy="967" r="4" fill="#53626a"/><circle cx="620" cy="967" r="4" fill="#53626a"/>
<text x="650" y="972" class="port">GND</text>
<text x="28" y="1018" class="small">5V 支路仅用于正文限定的 DevKitC-1 USB 单独供电；其他板卡先核对电源电路。</text>
<text x="28" y="1052" class="small">功放 SD/MODE、GAIN 使用所选模块厂商工作设置，不能把另一块板的短接线照搬过来。</text>
<text x="28" y="1086" class="small">本图与 44/42 针的位置图配合使用；针脚位置变了，GPIO 名称与模块信号对应关系不变。</text>
</svg>
