<text x="42" y="311" class="port">3V3</text>
<path d="M 390 306 H 620" fill="none" stroke="#c93e32" stroke-width="3"/>
<circle cx="390" cy="306" r="4" fill="#c93e32"/><circle cx="620" cy="306" r="4" fill="#c93e32"/>
<text x="650" y="311" class="port">VDD</text>
<text x="42" y="342" class="port">GND</text>
<path d="M 390 337 H 620" fill="none" stroke="#53626a" stroke-width="3"/>
<circle cx="390" cy="337" r="4" fill="#53626a"/><circle cx="620" cy="337" r="4" fill="#53626a"/>
<text x="650" y="342" class="port">GND</text>
