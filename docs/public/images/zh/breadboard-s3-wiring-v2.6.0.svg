<rect x="18" y="643" width="924" height="132" rx="12" fill="#fff" stroke="#cbded9"/>
<text x="36" y="673" class="group">扬声器 · 两根线都接功放输出</text>
<text x="42" y="699" class="small">MAX98357A</text>
<text x="650" y="699" class="small">无源扬声器</text>
<text x="42" y="731" class="port">SPK+ / OUTP</text>
