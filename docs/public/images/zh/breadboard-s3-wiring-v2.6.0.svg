<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1133" viewBox="0 0 960 1133" role="img" aria-labelledby="title desc">
<title id="title">基础 ESP32-S3 · 当前完整连线</title><desc id="desc">bread-compact-wifi / v2.6.0 · 分离输入/输出 I2S（Simplex）。信号、供电与接地用逐根导线表示；不是开发板排针位置图。</desc>
<style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#183738}.head{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#4b6266}.group{font-size:20px;font-weight:650}.port{font-size:17px}.small{font-size:14px;fill:#586b6e}</style>
<rect width="960" height="1133" rx="16" fill="#f5f9f8"/>
<text x="28" y="43" class="head">基础 ESP32-S3 · 当前完整连线</text>
<text x="28" y="74" class="sub">bread-compact-wifi / v2.6.0 · 分离输入/输出 I2S（Simplex）</text>
<text x="28" y="103" class="small">按 GPIO 与模块丝印连接；红色=电源，深灰=GND，紫色=时钟，青色=数据/控制。点击可看原尺寸。</text>
<rect x="18" y="130" width="924" height="256" rx="12" fill="#fff" stroke="#cbded9"/>
<text x="36" y="160" class="group">麦克风 · INMP441</text>
<text x="42" y="186" class="small">ESP32 主控</text>
<text x="650" y="186" class="small">INMP441</text>
<text x="42" y="218" class="port">GPIO4</text>
