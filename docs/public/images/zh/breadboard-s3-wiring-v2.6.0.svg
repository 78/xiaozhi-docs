<rect x="18" y="402" width="924" height="225" rx="12" fill="#fff" stroke="#cbded9"/>
<text x="36" y="432" class="group">功放 · MAX98357A</text>
<text x="42" y="458" class="small">ESP32 / USB 电源节点</text>
<text x="650" y="458" class="small">MAX98357A 模块</text>
