<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="title"><title id="title">声音复刻：两种输入，共用后续训练流程</title><rect width="720" height="404" rx="18" fill="#f3f8fa"/><g font-family="system-ui, sans-serif"><text x="32" y="43" font-size="23" font-weight="700" fill="#134e4a">声音复刻：两种输入，共用后续训练流程</text><rect x="26" y="68" width="668" height="78" rx="12" fill="white" stroke="#b6d7d4"/><circle cx="55" cy="102" r="16" fill="#0d9488"/><text x="55" y="108" text-anchor="middle" font-size="17" fill="white">1</text><text x="86" y="97" font-size="20" font-weight="600" fill="#183c43">现场录音：语言 / 风格 / 文案 / 麦克风权限</text><text x="86" y="124" font-size="16" fill="#52636b">或上传文件：选择源音频，上传不需要麦克风权限</text><path d="M360 144v18m-5-5 5 5 5-5" fill="none" stroke="#0d9488" stroke-width="2"/><rect x="26" y="170" width="668" height="78" rx="12" fill="white" stroke="#b6d7d4"/><circle cx="55" cy="204" r="16" fill="#0d9488"/><text x="55" y="210" text-anchor="middle" font-size="17" fill="white">2</text><text x="86" y="199" font-size="20" font-weight="600" fill="#183c43">下一步：音频编辑与试听</text><text x="86" y="226" font-size="16" fill="#52636b">选择 8–60 秒的清晰语音，确认实际提交的片段</text><path d="M360 246v18m-5-5 5 5 5-5" fill="none" stroke="#0d9488" stroke-width="2"/><rect x="26" y="272" width="668" height="78" rx="12" fill="white" stroke="#b6d7d4"/><circle cx="55" cy="306" r="16" fill="#0d9488"/><text x="55" y="312" text-anchor="middle" font-size="17" fill="white">3</text><text x="86" y="301" font-size="20" font-weight="600" fill="#183c43">阅读确认内容 → 开始复刻 → 查看状态</text><text x="86" y="328" font-size="16" fill="#52636b">可用后，在智能体角色配置中选择音色并保存</text></g></svg>
