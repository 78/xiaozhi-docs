<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1326" viewBox="0 0 960 1326" role="img" aria-labelledby="title desc">
<title id="title">S3 摄像头板 · 音频、屏幕与传感器信号</title><desc id="desc">bread-compact-wifi-s3cam / v2.6.0 · 与普通 S3 接线不同。信号、供电与接地用逐根导线表示；不是开发板排针位置图。</desc>
<style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#183738}.head{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#4b6266}.group{font-size:20px;font-weight:650}.port{font-size:17px}.small{font-size:14px;fill:#586b6e}</style>
<rect width="960" height="1326" rx="16" fill="#f5f9f8"/>
<text x="28" y="43" class="head">S3 摄像头板 · 音频、屏幕与传感器信号</text>
<text x="28" y="74" class="sub">bread-compact-wifi-s3cam / v2.6.0 · 与普通 S3 接线不同</text>
<text x="28" y="103" class="small">按 GPIO 与模块丝印连接；红色=电源，深灰=GND，紫色=时钟，青色=数据/控制。点击可看原尺寸。</text>
