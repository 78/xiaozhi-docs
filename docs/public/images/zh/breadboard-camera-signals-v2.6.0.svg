<text x="650" y="1165" class="port">SIOD</text>
<text x="28" y="1211" class="small">摄像头已通过排线接在 CAM 底板时，不需拆开逐根加线；先核对这块底板的原有连接。</text>
<text x="28" y="1245" class="small">这是信号分配图，未统一指定各模块电源；按实际 CAM 底板、屏幕与音频模块电气资料接电。</text>
<text x="28" y="1279" class="small">LCD GPIO19/20 与原生 USB 功能重叠，不能套用另一块板的 USB/引脚接法。</text>
</svg>
