<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">已有 MCP 服务：按实际传输方式选择一种接入路径</title><desc id="desc">stdio 本地命令与 SSE 或 Streamable HTTP 是两种替代接入路径，分别连接桥接进程，再接入小智端点。</desc><rect width="880" height="440" rx="18" fill="#f3f8fa"/><g font-family="system-ui, sans-serif" fill="#183c43"><text x="28" y="43" font-size="23" font-weight="700">按服务实际提供的传输方式，选择一种路径</text><rect x="28" y="82" width="390" height="146" rx="12" fill="white" stroke="#b6d7d4"/><rect x="462" y="82" width="390" height="146" rx="12" fill="white" stroke="#b6d7d4"/><text x="52" y="118" font-size="21" font-weight="600">本地 stdio 服务</text><text x="52" y="154" font-size="18">命令 + 参数 + 本地环境</text><text x="52" y="192" font-size="17">桥接进程启动工具子进程</text><text x="486" y="118" font-size="21" font-weight="600">SSE / Streamable HTTP 服务</text><text x="486" y="154" font-size="18">服务实际 MCP URL + 鉴权</text><text x="486" y="192" font-size="17">通过代理接入，不猜接口路径</text><g fill="none" stroke="#0d9488" stroke-width="3"><path d="M223 228v40h217m217-40v40H440v24m-6-6 6 6 6-6"/></g><rect x="100" y="296" width="680" height="92" rx="12" fill="white" stroke="#b6d7d4"/><text x="127" y="331" font-size="21" font-weight="600">桥接 → 小智端点 → 智能体的真实调用</text><text x="127" y="364" font-size="17">先单独验证一个服务，再验证工具发现和调用结果。</text><text x="28" y="419" font-size="17" fill="#52636b">普通 REST 或 WebSocket URL 不会因改配置类型就变成 MCP 服务。</text></g></svg>
