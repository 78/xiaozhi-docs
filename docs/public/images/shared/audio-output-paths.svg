<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173a3a}.small{font-size:14px;fill:#526a70}.label{font-size:17px}.title{font-size:23px;font-weight:650}.mono{font-family:ui-monospace,monospace;font-size:17px;fill:#0f766e}</style><rect width="900" height="392" rx="20" fill="#f1f7f6"/><title>音频输出和负载的正确对应关系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker></defs><text x="32" y="42" class="title">选择与负载匹配的输出</text><text x="32" y="70" class="small">三种接口，各有对应的电路和固件配置</text><rect x="24" y="98" width="212" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="130.0" y="134" text-anchor="middle" class="label">I2S 数字音频</text><rect x="306" y="98" width="280" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="446.0" y="134" text-anchor="middle" class="label">扬声器功放</text><rect x="656" y="98" width="220" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="766.0" y="134" text-anchor="middle" class="label">无源扬声器</text><path d="M 248 127 H 292 M 598 127 H 642" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="181" width="212" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="130.0" y="217" text-anchor="middle" class="label">I2S 数字音频</text><rect x="306" y="181" width="280" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="446.0" y="217" text-anchor="middle" class="label">Codec / 耳机驱动</text><rect x="656" y="181" width="220" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="766.0" y="217" text-anchor="middle" class="label">普通耳机</text><path d="M 248 210 H 292 M 598 210 H 642" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="264" width="212" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="130.0" y="300" text-anchor="middle" class="label">I2S 数字音频</text><rect x="306" y="264" width="280" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="446.0" y="300" text-anchor="middle" class="label">DAC / 线路输出</text><rect x="656" y="264" width="220" height="58" rx="10" fill="white" stroke="#c9dfda"/><text x="766.0" y="300" text-anchor="middle" class="label">有源音箱输入</text><path d="M 248 293 H 292 M 598 293 H 642" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="369" class="small">MAX98357 的 OUTP / OUTN 是扬声器输出，不是共地耳机或 Line Out。</text></svg>