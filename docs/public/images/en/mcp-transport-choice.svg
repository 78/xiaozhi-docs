<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">Choose a connection path for the service's actual MCP transport</title><desc id="desc">Local stdio and remote SSE/Streamable HTTP are alternative paths through a bridge to the XiaoZhi endpoint.</desc><rect width="880" height="440" rx="18" fill="#f3f8fa"/><g font-family="system-ui, sans-serif" fill="#183c43"><text x="28" y="43" font-size="23" font-weight="700">Choose the transport the service actually provides</text><rect x="28" y="82" width="390" height="146" rx="12" fill="white" stroke="#b6d7d4"/><rect x="462" y="82" width="390" height="146" rx="12" fill="white" stroke="#b6d7d4"/><text x="52" y="118" font-size="21" font-weight="600">Local stdio service</text><text x="52" y="154" font-size="18">Command + arguments + local environment</text><text x="52" y="192" font-size="17">Bridge starts the tool subprocess</text><text x="486" y="118" font-size="21" font-weight="600">SSE / Streamable HTTP service</text><text x="486" y="154" font-size="18">Actual MCP URL + authentication</text><text x="486" y="192" font-size="17">Connect through a proxy; do not guess paths</text><g fill="none" stroke="#0d9488" stroke-width="3"><path d="M223 228v40h217m217-40v40H440v24m-6-6 6 6 6-6"/></g><rect x="100" y="296" width="680" height="92" rx="12" fill="white" stroke="#b6d7d4"/><text x="127" y="331" font-size="21" font-weight="600">Bridge → XiaoZhi endpoint → actual agent call</text><text x="127" y="364" font-size="17">Verify one service independently, then check discovery and actual results.</text><text x="28" y="419" font-size="17" fill="#52636b">Changing a configuration type does not turn REST or WebSocket into MCP.</text></g></svg>
