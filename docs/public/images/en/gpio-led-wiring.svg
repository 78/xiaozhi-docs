<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">GPIO18 through a current-limiting resistor and LED to GND</title><desc id="desc">Basic S3 v2.6.0 LampController: GPIO18 to 330 ohms, then red LED anode; cathode to GND. Active high.</desc><rect width="900" height="400" rx="18" fill="#f3f8fa"/><g font-family="system-ui, sans-serif" fill="#183c43"><text x="30" y="43" font-size="24" font-weight="700">Basic S3: GPIO18 indicator</text><rect x="32" y="112" width="174" height="154" rx="12" fill="white" stroke="#b6d7d4"/><text x="57" y="150" font-size="19">ESP32-S3</text><text x="91" y="191" font-size="19">GPIO18</text><text x="124" y="245" font-size="19">GND</text><g fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round"><path d="M206 184H296m100 0H490m80 0h170v54H206"/><rect x="296" y="171" width="100" height="26" fill="white"/><path d="M490 160v48l54-24Z" fill="white"/><path d="M553 157v54M512 146l24-22m-15 0h15v15m4 12 24-22m-15 0h15v15"/></g><text x="314" y="150" font-size="20">330Ω</text><text x="469" y="248" font-size="17">LED anode (A)</text><text x="559" y="159" font-size="17">Cathode (K)</text><text x="423" y="104" font-size="18">Ordinary red LED with a series current-limiting resistor</text><text x="33" y="319" font-size="19">GPIO18 high: on; low: off. Use only when no other extension occupies this pin.</text><text x="33" y="352" font-size="17" fill="#52636b">Disconnect power to wire. Keep the resistor. No 5V; do not directly drive motors or relay coils.</text></g></svg>
