<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="title"><title id="title">Local build directories and workflow</title><rect width="720" height="404" rx="18" fill="#f3f8fa"/><g font-family="system-ui, sans-serif"><text x="32" y="43" font-size="23" font-weight="700" fill="#134e4a">Local build directories and workflow</text><rect x="26" y="68" width="668" height="78" rx="12" fill="white" stroke="#b6d7d4"/><circle cx="55" cy="102" r="16" fill="#0d9488"/><text x="55" y="108" text-anchor="middle" font-size="17" fill="white">1</text><text x="86" y="97" font-size="20" font-weight="600" fill="#183c43">ESP-IDF directory: install and activate</text><text x="86" y="124" font-size="16" fill="#52636b">Use the specified version; activate in each new terminal</text><path d="M360 144v18m-5-5 5 5 5-5" fill="none" stroke="#0d9488" stroke-width="2"/><rect x="26" y="170" width="668" height="78" rx="12" fill="white" stroke="#b6d7d4"/><circle cx="55" cy="204" r="16" fill="#0d9488"/><text x="55" y="210" text-anchor="middle" font-size="17" fill="white">2</text><text x="86" y="199" font-size="20" font-weight="600" fill="#183c43">xiaozhi-esp32 directory: check out firmware</text><text x="86" y="226" font-size="16" fill="#52636b">List boards and choose the matching build variant</text><path d="M360 246v18m-5-5 5 5 5-5" fill="none" stroke="#0d9488" stroke-width="2"/><rect x="26" y="272" width="668" height="78" rx="12" fill="white" stroke="#b6d7d4"/><circle cx="55" cy="306" r="16" fill="#0d9488"/><text x="55" y="312" text-anchor="middle" font-size="17" fill="white">3</text><text x="86" y="301" font-size="20" font-weight="600" fill="#183c43">Build → inspect → flash → read logs</text><text x="86" y="328" font-size="16" fill="#52636b">Check version and board, then test device functions</text></g></svg>
